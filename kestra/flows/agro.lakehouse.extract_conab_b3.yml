id: extract_conab_b3
namespace: agro.lakehouse
description: "Extrai cotações futuras de Soja (CBOT/B3) e CONAB para a camada Bronze"

tasks:
  - id: python_extract_bronze
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    warningOnStdErr: false
    env:
      MINIO_ENDPOINT: "172.17.0.1:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password123"
    beforeCommands:
      - pip install yfinance duckdb pandas pyiceberg[s3fs,sql,pyarrow] psycopg2-binary
    script: |
      import os
      import duckdb
      import pandas as pd
      import yfinance as yf
      from datetime import datetime

      print("Iniciando extração do Mercado Financeiro (yfinance)...")
      
      soja = yf.Ticker("ZS=F")
      hist = soja.history(period="10y")
      
      df_b3 = hist.reset_index()[['Date', 'Close']].copy()
      df_b3.rename(columns={"Date": "data_pregao", "Close": "preco_fechamento_usd"}, inplace=True)
      df_b3['data_pregao'] = df_b3['data_pregao'].dt.tz_localize(None)
      
      df_b3['ano'] = df_b3['data_pregao'].dt.year
      df_b3['mes'] = df_b3['data_pregao'].dt.month
      
      # Dados reais aproximados da CONAB (Série Histórica)
      conab_historico = {
          2015: 96200000,
          2016: 95400000,
          2017: 114300000,
          2018: 119300000,
          2019: 115000000,
          2020: 124800000,
          2021: 138200000,
          2022: 125500000,
          2023: 154600000,
          2024: 147400000,
          2025: 168300000
      }
      
      # Mapeia a produção real daquele ano (ou 168M como fallback para o futuro)
      df_b3['estimativa_safra_toneladas'] = df_b3['ano'].map(conab_historico).fillna(168300000)
      
      con = duckdb.connect(':memory:')
      endpoint = os.environ.get('MINIO_ENDPOINT', '172.17.0.1:9000')
      con.execute(f"""
          INSTALL httpfs;
          LOAD httpfs;
          SET s3_endpoint='{endpoint}';
          SET s3_access_key_id='admin';
          SET s3_secret_access_key='password123';
          SET s3_use_ssl=false;
          SET s3_url_style='path';
      """)
      
      # Garante tipos compatíveis no PyArrow antes de verificar iceberg
      import pandas as pd
      from datetime import datetime
      
      # Inicia Integração com Apache Iceberg
      from pyiceberg.catalog import load_catalog
      import pyarrow as pa
      
      endpoint_url = endpoint if endpoint.startswith('http') else f"http://{endpoint}"
      
      print("Conectando ao Catálogo Iceberg (SQL/PostgreSQL)...")
      catalog = load_catalog(
          "default",
          **{
              "type": "sql",
              "uri": "postgresql+psycopg2://kestra:password123@postgres:5432/kestra",
              "s3.endpoint": endpoint_url,
              "s3.access-key-id": "admin",
              "s3.secret-access-key": "password123",
          }
      )
      
      catalog.create_namespace_if_not_exists("agro_bronze")
      table_id = "agro_bronze.conab_b3_raw"
      
      # Garante tipos compatíveis no PyArrow
      df_b3['data_pregao'] = pd.to_datetime(df_b3['data_pregao'])
      df_arrow = pa.Table.from_pandas(df_b3)
      
      print("Salvando no Apache Iceberg...")
      try:
          table = catalog.load_table(table_id)
          df_existing = table.scan().to_pandas()
          if not df_existing.empty:
              max_date = pd.to_datetime(df_existing['data_pregao']).max()
              print(f"Modo Incremental: Maior data na base é {max_date}")
              # Trazemos apenas dados mais recentes
              df_b3 = df_b3[pd.to_datetime(df_b3['data_pregao']) > max_date]
              if df_b3.empty:
                  print("Nenhum dado novo para extrair. Finalizando fluxo de forma limpa.")
                  exit(0)
              
              print(f"{len(df_b3)} novos registros encontrados.")
              df_b3['data_pregao'] = pd.to_datetime(df_b3['data_pregao'])
              df_arrow = pa.Table.from_pandas(df_b3)
              
              # No Iceberg real a gente pode fazer Merge ou Append, aqui faremos append incremental
              table.append(df_arrow)
              print("Tabela Iceberg atualizada com sucesso (Append Incremental).")
          else:
              raise Exception("Tabela vazia")
      except Exception as e:
          print("Tabela não encontrada, criando nova tabela Iceberg...")
          # Garante tipos
          df_b3['data_pregao'] = pd.to_datetime(df_b3['data_pregao'])
          df_arrow = pa.Table.from_pandas(df_b3)
          
          table = catalog.create_table(
              table_id,
              schema=df_arrow.schema,
              location="s3://bronze/iceberg/conab_b3_raw"
          )
          table.append(df_arrow)
          print("Tabela Iceberg criada com sucesso (Full Load).")
      
      print("Processo de Extrato (Bronze) finalizado com sucesso.")

  - id: trigger_silver
    type: io.kestra.plugin.core.flow.Subflow
    flowId: transform_conab_b3_to_silver
    namespace: agro.lakehouse
    wait: false