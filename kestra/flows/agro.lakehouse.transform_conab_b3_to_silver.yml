id: transform_conab_b3_to_silver
namespace: agro.lakehouse
description: "Lê a camada Bronze (Iceberg), transforma os dados e envia para a camada Silver (Iceberg)"

tasks:
  - id: python_transform_silver
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    warningOnStdErr: false
    env:
      MINIO_ENDPOINT: "172.17.0.1:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password123"
    beforeCommands:
      - pip install duckdb pandas pyiceberg[s3fs,sql-postgres,pyarrow] psycopg2-binary
    script: |
      import os
      import duckdb
      import pandas as pd
      from pyiceberg.catalog import load_catalog
      import pyarrow as pa
      import pyarrow.compute as pc

      print("Conectando ao Catálogo Iceberg (SQL/PostgreSQL)...")
      endpoint = os.environ.get('MINIO_ENDPOINT', '172.17.0.1:9000')
      endpoint_url = endpoint if endpoint.startswith('http') else f"http://{endpoint}"
      
      catalog = load_catalog(
          "default",
          **{
              "type": "sql",
              "uri": "postgresql+psycopg2://kestra:password123@postgres:5432/kestra",
              "s3.endpoint": endpoint_url,
              "s3.access-key-id": "admin",
              "s3.secret-access-key": "password123",
          }
      )
      
      print("Lendo a tabela Bronze...")
      bronze_table = catalog.load_table("agro_bronze.conab_b3_raw")
      
      # Filtra nulls via PyArrow Compute ou Pandas
      # Lemos para pandas para facilitar transformações se necessário
      df_bronze = bronze_table.scan().to_pandas()
      df_silver = df_bronze[df_bronze['preco_fechamento_usd'].notnull()]
      
      # Garante tipos corretos
      df_silver['data_pregao'] = pd.to_datetime(df_silver['data_pregao']).astype('datetime64[us]')
      
      catalog.create_namespace_if_not_exists("agro_silver")
      table_id_silver = "agro_silver.conab_b3_silver"
      df_arrow_silver = pa.Table.from_pandas(df_silver)
      
      print("Salvando no Apache Iceberg (Camada Silver)...")
      try:
          silver_table = catalog.load_table(table_id_silver)
          silver_table.overwrite(df_arrow_silver)
          print("Tabela Iceberg Silver sobrescrita com sucesso.")
      except Exception as e:
          print("Tabela não encontrada, criando nova tabela Iceberg Silver...")
          silver_table = catalog.create_table(
              table_id_silver,
              schema=df_arrow_silver.schema,
              location="s3://silver/iceberg/conab_b3_silver"
          )
          silver_table.append(df_arrow_silver)
          print("Tabela Iceberg Silver criada com sucesso.")
      
      print("Processo de Transformação (Silver) finalizado com sucesso.")

  - id: trigger_gold
    type: io.kestra.plugin.core.flow.Subflow
    flowId: build_gold_conab_b3
    namespace: agro.lakehouse
    wait: false
