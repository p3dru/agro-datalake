id: build_gold_conab_b3
namespace: agro.lakehouse
description: "Lê a camada Silver (Iceberg) do CONAB/B3 e constrói a tabela Gold (Iceberg) final para consumo do Dashboard"

tasks:
  - id: python_aggregate_conab_b3
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install duckdb pandas pyiceberg[s3fs,sql-postgres,pyarrow] psycopg2-binary
    warningOnStdErr: false
    env:
      MINIO_ENDPOINT: "172.17.0.1:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password123"
    script: |
      import os
      import duckdb
      import pandas as pd
      from pyiceberg.catalog import load_catalog
      import pyarrow as pa

      print("Conectando ao Catálogo Iceberg (SQL/PostgreSQL)...")
      endpoint = os.environ.get('MINIO_ENDPOINT', '172.17.0.1:9000')
      endpoint_url = endpoint if endpoint.startswith('http') else f"http://{endpoint}"
      
      catalog = load_catalog(
          "default",
          **{
              "type": "sql",
              "uri": "postgresql+psycopg2://kestra:password123@postgres:5432/kestra",
              "s3.endpoint": endpoint_url,
              "s3.access-key-id": "admin",
              "s3.secret-access-key": "password123",
          }
      )
      
      print("Lendo a tabela Silver...")
      silver_table = catalog.load_table("agro_silver.conab_b3_silver")
      df_silver = silver_table.scan().to_pandas()
      
      # Agregação para a camada Gold
      df_gold = df_silver.groupby(['ano', 'mes']).agg(
          media_preco_usd=('preco_fechamento_usd', 'mean'),
          estimativa_safra=('estimativa_safra_toneladas', 'max')
      ).reset_index()
      
      catalog.create_namespace_if_not_exists("agro_gold")
      table_id_gold = "agro_gold.conab_b3_mercado"
      df_arrow_gold = pa.Table.from_pandas(df_gold)
      
      print("Gerando camada Gold no Iceberg...")
      try:
          gold_table = catalog.load_table(table_id_gold)
          gold_table.overwrite(df_arrow_gold)
          print("Tabela Iceberg Gold sobrescrita com sucesso.")
      except Exception as e:
          print("Tabela não encontrada, criando nova tabela Iceberg Gold...")
          gold_table = catalog.create_table(
              table_id_gold,
              schema=df_arrow_gold.schema,
              location="s3://gold/iceberg/conab_b3_mercado"
          )
          gold_table.append(df_arrow_gold)
          print("Tabela Iceberg Gold criada com sucesso.")
      
      print("Processo CONAB/B3 finalizado! Base Gold pronta para o dashboard.")
