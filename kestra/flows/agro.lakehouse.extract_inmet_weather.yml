id: extract_inmet_weather
namespace: agro.lakehouse
description: "Extrai dados climáticos brutos do INMET para a camada Bronze"

tasks:
  - id: python_extract_bronze
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    warningOnStdErr: false
    beforeCommands:
      - pip install requests pandas duckdb pyiceberg[s3fs,sql-postgres,pyarrow] psycopg2-binary
    env:
      MINIO_ENDPOINT: "172.17.0.1:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password123"
    script: |
      import os
      import duckdb
      import pandas as pd
      from datetime import datetime, timedelta
      import requests

      print("Iniciando extração do Clima (Open-Meteo) para as 4 capitais do MATOPIBA...")
      
      # Coordenadas das principais fronteiras (BA, MA, PI, TO)
      cidades = [
          {"nome": "Barreiras (BA)", "lat": -12.15, "lon": -44.99},
          {"nome": "Balsas (MA)", "lat": -7.53, "lon": -46.03},
          {"nome": "Uruçuí (PI)", "lat": -7.22, "lon": -44.55},
          {"nome": "Mateiros (TO)", "lat": -10.54, "lon": -46.42}
      ]
      
      end_date = datetime.today().strftime('%Y-%m-%d')
      start_date = (datetime.today() - timedelta(days=10*365)).strftime('%Y-%m-%d')
      
      dfs = []
      
      for cidade in cidades:
          lat, lon = cidade["lat"], cidade["lon"]
          print(f"Baixando dados de {cidade['nome']}...")
          url = f"https://archive-api.open-meteo.com/v1/archive?latitude={lat}&longitude={lon}&start_date={start_date}&end_date={end_date}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo"
          
          response = requests.get(url)
          if response.status_code != 200:
              print(f"Erro na API Open-Meteo para {cidade['nome']}: {response.text}")
              continue
              
          data = response.json()
          
          df_cidade = pd.DataFrame({
              "data_medicao": pd.to_datetime(data["daily"]["time"]),
              "precipitacao_mm": data["daily"]["precipitation_sum"],
              "temperatura_max": data["daily"]["temperature_2m_max"],
              "temperatura_min": data["daily"]["temperature_2m_min"]
          })
          dfs.append(df_cidade)
          
      if not dfs:
          print("Nenhum dado foi baixado com sucesso.")
          exit(1)
          
      print("Agregando médias climáticas regionais...")
      # Concatena e tira a média agrupando por data (isso gera a média da região do MATOPIBA inteira por dia)
      df_all = pd.concat(dfs)
      df = df_all.groupby('data_medicao').mean().reset_index()
      df['regiao'] = 'Matopiba'
      
      # Remove nulos
      df = df.dropna()
      
      con = duckdb.connect(':memory:')
      endpoint = os.environ.get('MINIO_ENDPOINT', '172.17.0.1:9000')
      con.execute(f"""
          INSTALL httpfs;
          LOAD httpfs;
          SET s3_endpoint='{endpoint}';
          SET s3_access_key_id='admin';
          SET s3_secret_access_key='password123';
          SET s3_use_ssl=false;
          SET s3_url_style='path';
      """)
      
      timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
      output_path = f"s3://bronze/inmet_raw_{timestamp}.parquet"
      
      print("Salvando Bronze...")
      con.execute(f"COPY df TO '{output_path}' (FORMAT PARQUET)")
      print("Processo finalizado com sucesso.")

  - id: trigger_silver
    type: io.kestra.plugin.core.flow.Subflow
    flowId: transform_inmet_to_silver
    namespace: agro.lakehouse
    wait: false
