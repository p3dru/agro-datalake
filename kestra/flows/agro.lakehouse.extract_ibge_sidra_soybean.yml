id: extract_ibge_sidra_soybean
namespace: agro.lakehouse

tasks:
  - id: fetch_sidra_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install requests boto3
    warningOnStdErr: false
    script: |
      import requests
      import json
      import os
      from datetime import datetime
      from boto3 import session

      # 1. Configuração da API do IBGE SIDRA
      # Entendendo a URL:
      # /t/1612: Tabela 1612 (Área plantada, colhida, quantidade produzida...)
      # /n3/all: Nível territorial 3 (Todos os Estados)
      # /v/109,214: Variáveis (109 = Área colhida em Hectares, 214 = Quantidade produzida em Toneladas)
      # /p/all: Período (Todos os anos disponíveis)
      # /c81/2713: Classificação 81 (Produto das lavouras temporárias), Categoria 2713 (Soja em grão)
      url = "https://apisidra.ibge.gov.br/values/t/1612/n3/all/v/109,214/p/all/c81/2713"
      
      print(f"Iniciando requisição para o IBGE SIDRA: {url}")
      response = requests.get(url)
      
      if response.status_code == 200:
          data = response.json()
          print(f"Dados extraídos com sucesso! {len(data)} registros encontrados.")
      else:
          print(f"Erro ao acessar a API: {response.status_code}. Detalhe: {response.text}")
          exit(1)

      # 2. Salvar o arquivo JSON bruto localmente
      filename = f"ibge_sidra_soja_{datetime.now().strftime('%Y%m%d_%H%M%S')}.json"
      with open(filename, 'w', encoding='utf-8') as f:
          json.dump(data, f, ensure_ascii=False, indent=4)
      
      print(f"Arquivo {filename} gerado com sucesso localmente.")

      # 3. Conexão com o MinIO local via Boto3
      s3_session = session.Session()
      s3_client = s3_session.client(
          service_name='s3',
          aws_access_key_id='admin',
          aws_secret_access_key='password123',
          endpoint_url='http://172.17.0.1:9000' 
      )

      print("Enviando o arquivo do IBGE para a Camada Bronze do MinIO...")
      s3_client.upload_file(filename, 'bronze', filename)
      print("Upload concluído! Dados físicos integrados ao Data Lake.")